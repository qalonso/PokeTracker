version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pokerun-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pokerun
      POSTGRES_PASSWORD: pokerun_dev_password
      POSTGRES_DB: pokerun_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pokerun-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokerun"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pokerun-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pokerun.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - pokerun-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  pokerun-network:
    driver: bridge